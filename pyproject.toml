[tool.black]
target-version = ["py312"]
line-length = 88
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | release-.*
)/
'''

[tool.isort]
profile = "black"
line_length = 88
force_sort_within_sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
