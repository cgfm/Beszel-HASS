name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements_dev.txt

      - name: Validate Python and JSON
        run: |
          python -m compileall -q custom_components tests create_release.py
          python -m json.tool custom_components/beszel/manifest.json >/dev/null
          python -m json.tool custom_components/beszel/strings.json >/dev/null
          python -m json.tool custom_components/beszel/translations/de.json >/dev/null
          python -m json.tool custom_components/beszel/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

      - name: Check formatting
        run: |
          for file in custom_components/beszel/*.py tests/*.py create_release.py; do black --workers 1 --check "$file"; done
          isort --check-only custom_components/beszel/*.py tests/*.py create_release.py

      - name: Run tests
        run: pytest -v

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
